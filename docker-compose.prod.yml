# Production stack for a single AWS EC2 instance (docs/DEPLOYMENT.md).
# Only `nginx` publishes a host port -- frontend, backend, and db are reached
# solely over the internal Compose network, by service name.
#
# Run with:  docker compose -f docker-compose.prod.yml up -d --build
# Required secrets come from a local, never-committed .env (.env.example
# lists every variable this file reads).
#
# Named explicitly so it never shares a Compose project (and therefore never
# reuses containers/networks/volumes) with the dev docker-compose.yml, which
# otherwise defaults to the same project name (the directory name) and the
# same service names.
name: jobboard-prod

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobboard}"]
      interval: 2s
      timeout: 3s
      retries: 20
    # No published port: the database is reachable only from `backend`, over
    # the internal network -- nothing outside this stack talks to it.

  backend:
    build: ./backend
    restart: unless-stopped
    # Overrides the dev image's default CMD (manage.py runserver): runs
    # migrations + collectstatic once, then hands off to Gunicorn. backend/
    # Dockerfile itself is unchanged -- this is prod-only wiring.
    entrypoint: ["sh", "/app/entrypoint.sh"]
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      # Always False in production -- fixed here, not read from .env, so a
      # misconfigured .env can never leave debug mode on in production.
      DJANGO_DEBUG: "False"
      # `backend` (the internal service hostname) is always appended: the
      # frontend's middleware calls the backend directly over the internal
      # network for its own auth check (INTERNAL_API_BASE_URL), bypassing
      # Nginx entirely, so that request's Host header is "backend" rather
      # than the public host/IP below -- Django's ALLOWED_HOSTS must accept
      # both. Only reachable from inside the Compose network; backend has no
      # published port.
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS is required, e.g. the EC2 public IP},backend"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - static_files:/app/staticfiles
    healthcheck:
      # 127.0.0.1, not localhost: Alpine (frontend) resolves localhost to ::1
      # first, which nothing listens on -- kept consistent here too.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/jobs/')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    # No published port: reachable only from `nginx`, over the internal
    # network.

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Relative path, not an EC2 host/IP -- see Dockerfile.frontend. Fixed
        # here rather than in .env since it never needs to vary by deploy.
        NEXT_PUBLIC_API_BASE_URL: /api
    restart: unless-stopped
    environment:
      # Server-side only (middleware.ts): reaches the backend directly over
      # the internal network, bypassing Nginx entirely.
      INTERNAL_API_BASE_URL: http://backend:8000/api
    healthcheck:
      # 127.0.0.1, not localhost: this Alpine image resolves localhost to the
      # IPv6 loopback (::1) first, which nothing listens on -- Node binds
      # 0.0.0.0 (IPv4) per HOSTNAME above -- so the healthcheck must be explicit.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy
    # No published port: reachable only from `nginx`.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - static_files:/app/staticfiles:ro
    ports:
      # Defaults to the required public port 80; overridable at invocation
      # (NGINX_PORT=8080 docker compose ...) only if 80 is already taken on
      # the host -- e.g. by another service during local verification. The
      # deployed default is unaffected.
      - "${NGINX_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
  static_files:
