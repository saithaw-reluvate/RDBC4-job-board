# Public reverse proxy (docs/DEPLOYMENT.md). Only this service is exposed to
# the host/internet; frontend, backend, and db are reached over the internal
# Compose network by service name. Mounted into the stock nginx:alpine image
# at /etc/nginx/conf.d/default.conf, replacing its sample "welcome" server.
upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Collected by `collectstatic` into a volume shared with the backend
    # container (Django admin + DRF browsable API assets) -- served directly
    # from disk, never proxied through Gunicorn.
    location /static/ {
        alias /app/staticfiles/;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        include /etc/nginx/proxy_params.conf;
    }

    location /admin/ {
        proxy_pass http://backend_upstream;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        proxy_pass http://frontend_upstream;
        include /etc/nginx/proxy_params.conf;
    }
}
